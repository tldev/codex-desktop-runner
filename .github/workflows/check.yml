name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install and exercise published package contents
        shell: bash
        run: |
          package_file=$(npm pack --silent)
          npm install --global --prefix "$RUNNER_TEMP/cdr-install" "./$package_file"
          "$RUNNER_TEMP/cdr-install/bin/codex-desktop-runner" --help
